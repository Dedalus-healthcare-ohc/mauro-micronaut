micronaut:
  server:
    port: 8088
  security:
    authentication-provider-strategy: any
    authentication: idtoken
    enabled: true
    redirect:
      enabled: true
    endpoints:
      logout:
        enabled: true
        get-allowed: true
      cookie:
        enabled: true
      oauth:
        enabled: true
      session:
        enabled: true
      reject-not-found: false
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:sandbox}
#          replace client secret
          client-secret: ${OAUTH_CLIENT_SECRET:EghVeWUaTdS4anAPynJC0AmFpfrUJDqR}
          openid.issuer: ${OIDC_ISSUER_DOMAIN:`http://localhost:9009`}/realms/${KEYCLOAK_REALM:master}

