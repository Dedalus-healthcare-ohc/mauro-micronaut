micronaut:
  security:
    enabled: true

    authentication-provider-strategy: any
    authentication: idtoken

    redirect:
      enabled: true
    endpoints:
      login:
        enabled: true
        path: '/authentication/login'
      logout:
        enabled: true
        #        path: '/authentication/logout'
        get-allowed: true
      cookie:
        enabled: true
      oauth:
        enabled: true
      session:
        enabled: true
      reject-not-found: false
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:sandbox}
          client-secret: ${OAUTH_CLIENT_SECRET:FR5Xz0TaymuAyPxGIqFRhf8HpBtwyOVi}
          openid.issuer: ${OIDC_ISSUER_DOMAIN:`http://localhost:`${random.port}}/realms/${KEYCLOAK_REALM:master}

